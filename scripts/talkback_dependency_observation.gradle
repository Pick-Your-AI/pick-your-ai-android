// Build-only observation. First-seen hashes are not a dependency approval manifest.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

def destination = System.getProperty('talkback.prerequisite.dependencies')
if (!destination) {
    throw new GradleException('The fixed prerequisite dependency output is required')
}
def artifacts = [:]
def components = new TreeSet<String>()
def used = new TreeSet<String>()
def androidModules = [:]

// Gradle 8.13 resets buildscript classpath state after assembling the script
// classloader. Capture the actual resolution before that reset, rather than
// inspecting Configuration.state at buildFinished or resolving unused inputs.
def observe = { key, configuration ->
    synchronized (artifacts) {
        used.add(key)
        configuration.incoming.resolutionResult.allComponents.each { component ->
            if (component.id instanceof ModuleComponentIdentifier) {
                components.add(component.id.displayName)
            }
        }
        def view = configuration.incoming.artifactView {
            componentFilter { id -> id instanceof ModuleComponentIdentifier }
        }
        view.artifacts.artifacts.each { artifact ->
            def file = artifact.file
            if (!file.isFile()) {
                throw new GradleException('A resolved external artifact is not an ordinary file')
            }
            def digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            def sha = digest.digest().encodeHex().toString()
            def component = artifact.id.componentIdentifier.displayName
            artifacts["${component}|${file.name}|${sha}"] = [
                component: component, name: file.name, bytes: file.length(), sha256: sha
            ]
            if (artifacts.size() > 20000 || components.size() > 20000) {
                throw new GradleException('Dependency observation exceeds its declared bound')
            }
        }
    }
}
gradle.beforeProject { project ->
    [project.configurations, project.buildscript.configurations].eachWithIndex { container, kind ->
        container.configureEach { configuration ->
            configuration.resolutionStrategy.failOnDynamicVersions()
            configuration.resolutionStrategy.failOnChangingVersions()
            def key = "${project.path}|${kind}|${configuration.name}".toString()
            configuration.incoming.afterResolve { observe(key, configuration) }
        }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.allprojects.each { project ->
        def android = project.extensions.findByName('android')
        if (android != null) {
            if (android.compileSdkVersion != 'android-36' || android.buildToolsVersion != '35.0.0') {
                throw new GradleException("Unexpected Android build tools in ${project.path}")
            }
            androidModules[project.path] = [
                compile_sdk: android.compileSdkVersion,
                build_tools: android.buildToolsVersion
            ]
        }
    }
}
gradle.buildFinished { result ->
    if (result.failure != null) {
        return
    }
    if (artifacts.isEmpty() || androidModules.isEmpty()) {
        throw new GradleException('Build completed without the required dependency observations')
    }
    def receipt = [
        schema: 'talkback-dependency-observation/v1',
        build_completed: true,
        preapproved_checksums: false,
        gradle: gradle.gradleVersion,
        android_modules: androidModules.sort(),
        configurations: used.toList(),
        components: components.toList(),
        artifacts: artifacts.sort().values().toList()
    ]
    new File(destination).setText(JsonOutput.prettyPrint(JsonOutput.toJson(receipt)) + '\n', 'UTF-8')
}
