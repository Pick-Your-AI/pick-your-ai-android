name: Existing Intel macOS hypervisor capability (diagnostic)

on:
  pull_request:
    paths:
      - .github/workflows/android-hvf-probe.yml

permissions: {}

jobs:
  existing-hvf:
    name: Observe existing Intel runner acceleration
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Record bounded existing hypervisor observations
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import sys
          import time

          limit = 6000
          receipt = {
              "scope": "Existing host capability only; no AVD, installation or app execution",
              "source": os.environ.get("GITHUB_SHA"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "image_version": os.environ.get("ImageVersion"),
              "system": platform.system(),
              "machine": platform.machine(),
              "observations": {},
              "existing_hvf_usable": False,
          }

          def bounded(value):
              if isinstance(value, bytes):
                  value = value.decode("utf-8", errors="replace")
              value = value or ""
              return value[:limit], len(value) > limit

          def observe(name, command, timeout):
              started = time.monotonic()
              record = {"command": command, "timeout_seconds": timeout}
              receipt["observations"][name] = record
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=timeout)
                  record["exit_code"] = result.returncode
                  stdout, stderr = result.stdout, result.stderr
              except subprocess.TimeoutExpired as exc:
                  record["timed_out"] = True
                  stdout, stderr = exc.stdout, exc.stderr
              finally:
                  record["elapsed_seconds"] = round(time.monotonic() - started, 3)
              record["stdout"], out_truncated = bounded(stdout)
              record["stderr"], err_truncated = bounded(stderr)
              record["output_truncated"] = out_truncated or err_truncated
              return record

          try:
              if not (
                  os.environ.get("GITHUB_ACTIONS") == "true"
                  and os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"
                  and receipt["runner_os"] == "macOS"
                  and receipt["runner_arch"] == "X64"
                  and receipt["system"] == "Darwin"
                  and receipt["machine"] == "x86_64"
              ):
                  raise RuntimeError("Expected the explicit GitHub-hosted Intel macOS runner")
              sdk = os.environ.get("ANDROID_HOME")
              if not sdk:
                  raise RuntimeError("Preinstalled ANDROID_HOME is unavailable")
              emulator = pathlib.Path(sdk) / "emulator" / "emulator"
              if not emulator.is_file():
                  raise RuntimeError("Preinstalled emulator is unavailable; no installation attempted")
              host = observe("kern_hv_support", ["/usr/sbin/sysctl", "-n", "kern.hv_support"], 5)
              version = observe("emulator_version", [str(emulator), "-version"], 30)
              accel = observe("emulator_accel_check", [str(emulator), "-accel-check"], 30)
              complete = all(
                  item.get("exit_code") == 0 and not item["output_truncated"]
                  for item in (host, version, accel)
              )
              receipt["existing_hvf_usable"] = bool(
                  complete
                  and host["stdout"].strip() == "1"
                  and "Hypervisor.Framework" in accel["stdout"]
              )
              if not receipt["existing_hvf_usable"]:
                  receipt["failure"] = "Existing HVF capability was not established by these observations"
          except (OSError, RuntimeError, UnicodeError) as exc:
              receipt["failure"] = str(exc)[:limit]
          finally:
              print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)
          sys.exit(0 if receipt["existing_hvf_usable"] else 1)
          PY
