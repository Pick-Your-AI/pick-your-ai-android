name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Pinned secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner source and disclosure guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_secrets.py' -v
      - name: Prove seeded detection and removal, then scan reachable history
        run: python3 scripts/check_secrets.py
      - name: Retain sanitized secret-scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-${{ github.sha }}
          path: build/security/secret-scan.json
          retention-days: 7
          if-no-files-found: error
