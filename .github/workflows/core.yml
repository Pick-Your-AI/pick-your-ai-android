  android-preview:
    name: Unsigned synthetic Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      unsigned_apk_sha256: ${{ steps.apk-handoff.outputs.sha256 }}
      unsigned_artifact_id: ${{ steps.upload-preview.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Ensure experimental SDK inputs
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile unsigned preview, run lint and simulated UI tests
        run: ./gradlew --no-daemon --dependency-verification=strict --init-script scripts/runtime_inventory.init.gradle.kts -PandroidPreview=true :preview:assembleDebug :preview:lintDebug :preview:testDebugUnitTest runtimeInventory
      - name: Require legacy Back confirmation regressions
        run: |
          python - <<'PYLEGACYBACK'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = 'ai.pickyour.android.preview.LegacyBackNavigationTest'
          expected = {
              'sdk28BackKeepsInvalidPendingFieldsUntilExplicitChoice',
              'stayRetainsRawFieldsAndDoesNotWriteAnInvalidForm',
              'explicitLeaveCancelsQueuedAutosaveAndRetainedSaveCannotWrite',
              'untouchedBlankEditorUsesThePlatformBackAction',
              'acknowledgedEditorUsesThePlatformBackActionWithoutWriting',
              'changedThenRestoredInputCannotReviveAnOldLeaveChoice',
              'repeatedBackRetiresTheOlderChoiceAndConsumesTheCurrentChoiceOnce',
              'pauseRetiresTheChoiceAndResumeRequiresANewBackAction',
              'recreatedPendingEditorDoesNotRestoreTheOldLeaveAuthority',
              'pendingWriteOffersNoLeaveChoiceAndItsAcknowledgmentRetiresTheNotice',
              'stayPreservesTheExistingValidFormAutosaveDeadline',
          }
          path = pathlib.Path('preview/build/test-results/testDebugUnitTest') / ('TEST-' + qualified + '.xml')
          suite = ET.parse(path).getroot()
          cases = suite.findall('testcase')
          names = [case.attrib['name'] for case in cases]
          if suite.attrib.get('name') != qualified or set(names) != expected or len(names) != len(expected):
              raise SystemExit('Missing, foreign or duplicate legacy Back regression')
          if int(suite.attrib['tests']) != len(cases) or any(int(suite.attrib.get(k, '0')) for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Legacy Back regressions did not execute cleanly')
          if any(case.attrib.get('classname') != qualified or list(case) for case in cases):
              raise SystemExit('Legacy Back regression failed, skipped or has an unexpected result')
          print(f'Verified {len(cases)} SDK 28 legacy Back cases; API 31+ behavior and installed evidence remain separate')
          PYLEGACYBACK
      - name: Require configuration bootstrap and lifecycle regressions
        run: |
          python - <<'PYENVIRONMENT'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = 'ai.pickyour.android.preview.EnvironmentBootstrapTest'
          expected = {
              'actualPackagedProfileMatchesAppAndFrozenCatalogMetadata',
              'realAndUnknownSelectionsCannotAdmitPackagedPreview',
              'missingMalformedAndWrongContractAreActionableWithoutRawValues',
              'blockedScreenContainsOnlyFiniteRecoveryAndCloseAction',
              'admittedPreviewStillCreatesAndRestoresLocalControls',
              'rejectedActivityCannotRestoreEditOrOpenDraftsAcrossLifecycle',
              'configurationSourceClosesAndFreshAdmissionDoesNotRetainFailure',
          }
          path = pathlib.Path('preview/build/test-results/testDebugUnitTest') / ("TEST-" + qualified + ".xml")
          suite = ET.parse(path).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != qualified or not expected <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing, foreign or duplicate environment regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(k, "0")) for k in ("failures", "errors", "skipped")):
              raise SystemExit("Environment regressions did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Environment regression failed or skipped")
          print(f"Verified {len(cases)} environment admission cases")
          PYENVIRONMENT
      - name: Verify non-secret environment configuration and unavailable real selections
        shell: bash
        run: |
          python -m unittest discover -s scripts/tests -p 'test_environment_configuration.py' -v
          python -O -m unittest discover -s scripts/tests -p 'test_environment_configuration.py' -v
          python scripts/check_environment_configuration.py
          mkdir -p build/environment-selection
          for selected in staging production; do
            log="build/environment-selection/$selected.log"
            if ./gradlew --no-daemon --dependency-verification=strict -PandroidPreview=true -PandroidEnvironment="$selected" :preview:tasks >"$log" 2>&1; then
              echo "An unconfigured real environment was incorrectly accepted."
              exit 1
            fi
            if ! grep -Fq 'Android real-data configuration is unavailable:' "$log"; then
              echo "The real-environment build failed outside its admission guard."
              exit 1
            fi
          done
      - name: Reject ignored packaged preview assets
        run: python scripts/check_runtime_inventory_guards.py --preview
      - name: Export and validate the current runtime SPDX document
        run: python scripts/runtime_sbom.py
      - name: Inspect the packaged synthetic preview policy
        run: |
          python -m unittest discover -s scripts/tests -p 'test_preview_policy.py'
          python scripts/check_preview_policy.py --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          python scripts/check_preview_policy_guards.py --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Require synthetic scenario admission regressions to execute
        run: |
          python - <<'PYSCENARIOS'
          import pathlib
          import xml.etree.ElementTree as ET
          class_name = "ai.pickyour.android.preview.SyntheticScenarioDataTest"
          report = pathlib.Path("preview/build/test-results/testDebugUnitTest") / f"TEST-{class_name}.xml"
          suite = ET.parse(report).getroot()
          expected = {
              "allFiveSamplesRetainSyntheticVersionAndDistinctInputIdentity",
              "emptySampleIsOnlyAnExpectedSchemaRejectionWithoutAnAcceptedBuildOrReport",
              "allDiagnosticFieldsMatchActualFrozenPythonReferenceAndRetainUnknowns",
              "coreSampleKeepsT6AndDisablesOnlyTheFourteenOptionalSelections",
              "partialQuoteKeepsRecordedMoneyUnpricedAndUnclassifiedEvidenceSeparate",
              "manifestVersionsMalformedBytesAndSelfDeclaredReplacementHashesCannotBeAdmitted",
              "eachMissingChangedOrSwappedInputRejectsBeforeAnUnrelatedSampleCanSucceed",
              "byteBudgetsFailClosedBeforeAnyFixtureEvaluation",
              "acceptedResultCannotBeReboundByLaterCallerArrayOrMapMutation",
              "deliveryPlansAreImmutableFiniteDefinitionsWithExplicitRetryAndNewerFirstOrder",
          }
          cases = suite.findall("testcase")
          if suite.get("name") != class_name or len(cases) != len(expected) or {case.get("name") for case in cases} != expected:
              raise SystemExit("Synthetic scenario reader cases are missing, duplicated or unexpected")
          if any(case.get("classname") != class_name or any(case.find(tag) is not None for tag in ("failure", "error", "skipped")) for case in cases):
              raise SystemExit("Synthetic scenario reader case did not execute and pass")
          print(f"All {len(expected)} synthetic scenario reader cases executed and passed; no scenario UI or installed-device inference.")
          PYSCENARIOS
      - name: Require automatic form-save regressions to execute
        run: |
          python - <<'PYAUTOSAVE'
          import pathlib
          import xml.etree.ElementTree as ET
          class_name = "ai.pickyour.android.preview.PreviewAutosaveActivityTest"
          suite = ET.parse(pathlib.Path("preview/build/test-results/testDebugUnitTest") / f"TEST-{class_name}.xml").getroot()
          expected = {
              "initialLoadAndIdleDoNotCreateAnUneditedDraft",
              "rapidChangesAutosaveOnlyTheCompleteLatestFormAfterThePause",
              "manualSaveConsumesThePendingDelayWithoutDuplicatingARevision",
              "editingDuringAutosaveKeepsNewInputsUntilTheirOwnDurableAcknowledgement",
              "invalidWorkloadCancelsThePendingSaveAndCorrectionCommitsTheWholeForm",
              "failedAutosavePreservesTheHeadAndPauseAcrossRecreationUntilExplicitRetry",
              "aConcurrentWriterBlocksAutomaticRetryAndRecreationCannotAdoptItsAuthority",
