name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Frozen contracts and JVM core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Verify frozen import and reference conformance
        run: python scripts/check_contracts.py
      - name: Prove tampering fails closed
        run: python -m unittest discover -s tests -v
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile and test JVM core
        run: ./gradlew --no-daemon :core:check :core:assemble
      - name: Retain test and library artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-verification-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            core/build/libs/
          retention-days: 7
          if-no-files-found: ignore
