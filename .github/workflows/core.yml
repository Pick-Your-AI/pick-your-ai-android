name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Frozen contracts and JVM core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Verify frozen import and reference conformance
        run: python scripts/check_contracts.py
      - name: Prove tampering fails closed
        run: python -m unittest discover -s tests -v
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Verify emulator harness target and evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_android_emulator_smoke.py' -v
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile and test JVM core
        run: ./gradlew --no-daemon :core:check :core:assemble
      - name: Retain test and library artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-verification-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            core/build/libs/
          retention-days: 7
          if-no-files-found: ignore
  android-preview:
    name: Unsigned synthetic Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure experimental SDK inputs
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile unsigned preview, run lint and simulated UI tests
        run: ./gradlew --no-daemon --dependency-verification=strict -PandroidPreview=true :preview:assembleDebug :preview:lintDebug :preview:testDebugUnitTest
      - name: Require all simulated UI regressions to execute
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path("preview/build/test-results/testDebugUnitTest/TEST-ai.pickyour.android.preview.PreviewActivityTest.xml")
          suite = ET.parse(report).getroot()
          expected = {
              "acknowledgedFieldsAndExplicitEmptySurviveRecreation",
              "newerDiskHeadCannotAdoptStalePendingFormAfterRecreation",
              "tierActivationRequiresCleanFormAndExplicitConfirmation",
              "comparisonDistinguishesLiteralSentinelWithoutWriting",
              "editorsExposeLabelsAndSavedStatusUsesTextAndLiveRegion",
              "confirmedCurrentDraftDeletionRetainsPendingFormAndRevokesSaveAuthority",
              "catalogQuerySurvivesDetailsAndRecreationWithoutChangingPinnedSelection",
              "emptyCatalogSearchCanRecoverAndReloadUsesTheCurrentQuery",
              "largeTextRtlButtonsRetainMeasuredTargetsAndUntruncatedLabels",
              "forwardFocusOrderKeepsEditorsAndClearActionReachable",
              "findingsInspectionKeepsOutcomeSeveritySeparateAndNeverWritesDraft",
          }
          cases = suite.findall("testcase")
          assert expected <= {case.attrib["name"] for case in cases}, "Missing UI regression"
          assert all(not case.findall("failure") and not case.findall("error") and not case.findall("skipped") for case in cases), "UI regression did not pass"
          assert int(suite.attrib["tests"]) >= len(expected)
          print(f"Verified {len(cases)} simulated Activity tests; no installed-device claim")
          PYTEST
      - name: Prepare the disposable installed-emulator lane
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64'
      - name: Exercise installed synthetic preview on its owned AVD
        run: python scripts/android_emulator_smoke.py
      - name: Require the exact installed-emulator receipt
        run: |
          python - <<'PYSMOKE'
          import json
          import os
          from pathlib import Path
          from scripts.android_emulator_smoke import complete_receipt
          receipt = json.loads(Path("preview/build/reports/emulator-smoke/receipt.json").read_text())
          complete_receipt(receipt, os.environ["GITHUB_SHA"])
          print("All four installed AOSP-emulator cases passed; physical-device acceptance remains separate")
          PYSMOKE
      - name: Retain unsigned diagnostic and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-preview-${{ github.sha }}
          path: |
            preview/build/outputs/apk/debug/*-unsigned.apk
            preview/build/reports/lint-results-debug.*
            preview/build/reports/tests/testDebugUnitTest/
            preview/build/test-results/testDebugUnitTest/
            preview/build/reports/emulator-smoke/
          retention-days: 7
          if-no-files-found: ignore
