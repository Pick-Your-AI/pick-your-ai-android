name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Frozen contracts and JVM core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Verify frozen import and reference conformance
        run: python scripts/check_contracts.py
      - name: Verify versioned synthetic scenario data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/check_preview_scenarios.py
          python -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
          python -O -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
      - name: Prove tampering fails closed
        run: python -m unittest discover -s tests -v
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Verify emulator harness target and evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_android*.py' -v
      - name: Verify pinned conformance inputs and adversarial receipt guards
        run: |
          python scripts/check_conformance_fixtures.py
          python -m unittest discover -s scripts/tests -p 'test_conformance_fixtures.py' -v
      - name: Verify typed comparison input and receipt guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s scripts/tests -p 'test_typed_comparison_fixtures.py' -v
          python -O -m unittest discover -s scripts/tests -p 'test_typed_comparison_fixtures.py' -v
      - name: Verify runtime SPDX mapping and stale-evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_runtime_sbom.py' -v
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile and test JVM core
        run: ./gradlew --no-daemon --dependency-verification=strict --init-script scripts/runtime_inventory.init.gradle.kts :core:check :core:assemble runtimeInventory
      - name: Require typed hosting platform Core regressions
        run: |
          python - <<'PYHOSTINGCORE'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              'ai.pickyour.core.preview.PreviewHostingPlatformSettingsTest': {
                  'threeOptionalFieldsUseTheExactFrozenStringPatternAndChoiceMetadata()',
                  'allEightPresenceCombinationsAndExplicitRemovalKeepOmissionDistinct()',
                  'regionPreservesEmptyWhitespaceUnicodeControlsAndUnknownAsLiteralStrings()',
                  'jsonLookingRegionTextCannotInjectSettingsOrChangeItsStringType()',
                  'everyNetworkChoiceAndOmissionRoundTripWithoutDefaultsOrCaseCoercion()',
                  'frozenReceiverRejectsNonStringFieldsAndUnrecognizedKeysWithoutTypedCoercion()',
                  'malformedUnicodeAndOverlongFieldsCannotPrepareACommand()',
                  'completeSettingsBudgetIncludesJsonEnvelopeAndEscapedOriginalValues()',
                  'opaqueAccountReferencesPreserveCasePunctuationAndFrozenFinalLfSemantics()',
                  'rawSecretsAndInvalidReferencesCannotSaveOrEnterBoundedTypedRecovery()',
                  'independentFieldErrorsAreValueFreeAndNeverExposeAPartialCommand()',
                  'individuallyAdmittedFieldsCannotBypassTheCombinedSettingsBudget()',
                  'configurePreservesIdentityRoleFlagsNotesExtensionsLinksAndUnrelatedContent()',
                  'managedNoopSuppliedEmptyStaleAndDeletedAuthorityRemainDistinct()',
                  'removedSelectionCannotBeRecreatedByAPreparedHostingCommand()',
                  'threeStringsReopenAndRoundTripThroughAnExplicitValidatedBuildCandidate()',
                  'rejectedSettingsCannotReplaceAcknowledgedRevisionOrManagedFileBytes()',
                  'unsupportedKindsStayUnchangedAndCannotSupplyHostingPreparation()',
              },
          }
          for qualified, expected in required.items():
              path = pathlib.Path('core/build/test-results/test') / ("TEST-" + qualified + ".xml")
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib.get("name") for case in cases]
              if suite.tag != "testsuite" or suite.attrib.get("name") != qualified or any(case.attrib.get("classname") != qualified for case in cases):
                  raise SystemExit("Wrong typed hosting platform regression report")
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit("Missing, unexpected or repeated typed hosting platform regression")
              if int(suite.attrib.get("tests", "-1")) != len(cases) or any(int(suite.attrib.get(key, "-1")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit("Typed hosting platform result totals do not match passing execution")
              if any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit("Typed hosting platform regression did not execute successfully")
              print(f"Verified {len(cases)} source-named cases in {qualified}; no installed-device claim")
          PYHOSTINGCORE
      - name: Require current and recorded provisional-guidance Core regressions
        run: |
          python - <<'PYCURRENTGUIDANCE'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              'ai.pickyour.core.evaluation.DraftCurrentProvisionalGuidanceTest': {
                  'bothRegisteredProfilesUseRealEmptyCurrentFailureWithoutChangingFindings()',
                  'realProviderConflictAndMissingFoundationKeepIndependentGuidance()',
                  'realPassUnknownAndSkippedNeverAcquireProvisionalGuidance()',
                  'disabledPrimaryAndEnabledFallbackRemainMissingRequiredPresence()',
                  'optionalRequiredGuidanceAppearsOnlyForAnActuallyFailedActiveRule()',
                  'changedRulesetIdentityMetadataAndOrderRefuseAllCurrentFacets()',
                  'objectKeyOrderDoesNotChangeTheRegisteredCurrentProfile()',
                  'callerMutationCannotChangeCapturedRulesFindingsOrGuidance()',
                  'removedAndDisabledPredecessorIdsCannotSupplyCurrentPresence()',
                  'unavailableCurrentAttemptsDoNotProduceGuidanceBearingOutcomes()',
              },
              'ai.pickyour.core.evaluation.ProvisionalFindingGuidanceTest': {
                  'both exact profiles recognize the same failed presence and fit contexts()',
                  'pass unknown and skipped never acquire either provisional label()',
                  'all required conjunction rows need an actual failure and a missing primary choice()',
                  'present choice failures use only the finite fit inventory and leave other rules unclassified()',
                  'overlapping required and fit rows distinguish absence from a reported conflict()',
                  'object key order is irrelevant while rules and expression array order stay pinned()',
                  'unrecognized identity and changed metadata cannot borrow the registered rules()',
                  'raw floating types cannot impersonate integral pinned operands()',
                  'duplicate IDs including disabled rows withhold every guidance facet()',
                  'ambiguous referenced roles are withheld while an independent missing choice remains visible()',
                  'fallback and disabled selections never substitute for the required primary()',
                  'captured guidance stays with its admitted Build and exposes no private source fields()',
              },
          }
          total = 0
          for name, expected in required.items():
              path = pathlib.Path('core/build/test-results/test') / f"TEST-{name}.xml"
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib.get("name", "") for case in cases]
              if suite.tag != "testsuite" or suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
                  raise SystemExit('Foreign current and recorded provisional-guidance report')
              if len(cases) != len(list(suite.iter("testcase"))) or any(not item.strip() for item in names) or len(names) != len(set(names)) or not expected.issubset(names):
                  raise SystemExit('Missing, empty, nested or repeated current and recorded provisional-guidance regression')
              if int(suite.attrib.get("tests", "-1")) != len(cases) or any(int(suite.attrib.get(key, "-1")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit('Current and recorded provisional-guidance totals did not pass')
              if any(case.find(".//" + tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit('Current and recorded provisional-guidance regression did not execute successfully')
              total += len(cases)
          print(f"Verified {total} distinct passing current and recorded provisional-guidance cases across {len(required)} suites; no installed-device claim")
          PYCURRENTGUIDANCE
      - name: Require current-draft binding and invalidation Core regressions
        run: |
          python - <<'PYCURRENT'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              'ai.pickyour.core.evaluation.DraftCurrentEvaluationTest': {
                  'wholeCurrentContextUsesExistingRulesAndKeepsUnrepresentedPrivateFields()',
                  'callerByteMutationCannotChangeCapturedPinsGraphOrLaterEvaluation()',
                  'malformedOversizedDuplicateAndUnsupportedInputsNeverCreateAPin()',
                  'canonicalModelEditInvalidatesForwardAndInverseIdentitiesWithoutEditingHistory()',
                  'modeOnlyReplacementRechecksRemoteAcceleratorModelEdge()',
                  'optionalIntentDisableAndUnknownRetainPriorIdsAndWithholdContradictoryObservations()',
                  'removedAndDisabledSelectionsRemainInTheAcknowledgedTransition()',
                  'exactCatalogContextUnknownAndProductionChangesStayConservative()',
                  'replacementGraphUsesOldBindingAndIncludesRemovedEdges()',
                  'duplicateCycleAndSelfEdgesKeepFiniteDeterministicSelectionAttendance()',
                  'anotherStoreNeverBorrowsPriorDraftIdentitiesEvenAtTheSameRevision()',
                  'unrepresentedAndTypedWorkloadChangesRetireTheCompleteRuleBasis()',
              },
              'ai.pickyour.core.preview.PreviewCurrentDraftAnalysisTest': {
                  'firstLoadReadsHeadTwiceRunsOnceAndRerendersWithoutRescheduling()',
                  'unsavedEditAndRevertCannotReviveTheRetiredSameHashAttempt()',
                  'nextAcknowledgedSourceUsesSupersededPredecessorNotLastSuccessfulResult()',
                  'runningOldCompletionCannotOverwriteNewerSourceEvenWithReentrantDelivery()',
                  'actualDurableMutationDuringEvaluationRejectsTheOtherwiseValidResult()',
                  'readFailuresAndStaleHeadNeverInvokeTheEvaluatorAndRequireRetry()',
                  'postEvaluationReadFailureWithholdsAndExplicitRetryRecovers()',
                  'foreignOutcomeCannotAcquireAnotherSourceAttempt()',
                  'differentStoreWithIdenticalBytesGetsItsOwnAttemptAndNoPredecessor()',
                  'artifactAbaAndLifecycleRetirementKeepFreshTokensAndHistoricalBytes()',
              },
          }
          for name, expected in required.items():
              path = pathlib.Path('core/build/test-results/test') / ("TEST-" + name + ".xml")
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib.get("name") for case in cases]
              if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
                  raise SystemExit("Foreign current-draft regression report")
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit("Missing, unexpected or repeated current-draft regression")
              if int(suite.attrib.get("tests", "-1")) != len(cases) or any(int(suite.attrib.get(key, "-1")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit("Current-draft regression totals did not pass")
              if any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit("Current-draft regression did not execute successfully")
              print(f"Verified {len(cases)} source-named current-draft cases in {name}; no installed-device claim")
          PYCURRENT
      - name: Require selected historical cost admission regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.comparison.SelectedCostComparisonTest"
          expected = {
              "default costs stay not loaded and structural comparison remains unchanged()",
              "explicit missing input differs from no attempted admission on either side()",
              "requested estimate and arbitrary precision selected revision are admitted exactly()",
              "admitted cost cannot move to changed settings roles objectives or locks under reused identity()",
              "explicit costs for both changed selected records retain their own Build contents()",
              "equivalent selected JSON values match without requiring property order or numeric spelling()",
              "stale revision different Build and different locked pricebook reject the supplied estimate()",
              "matching Build fields do not override the explicitly requested estimate identity()",
              "complete unsupported input differs from malformed or failed provider input()",
              "missing selected Pricebook pin stays unavailable without a current Pricebook fallback()",
              "existing cost integrity rejections survive selected admission without partial records()",
              "changed currency period Pricebook and dated evidence stay literal and noncomparable()",
              "complete original line evidence and unsupported quantity survive the selection boundary()",
              "empty unknown coverage is admitted evidence and never a missing or accepted total()",
              "reused estimate identities still expose differing complete records()",
              "line limits return no partial comparison and a later bounded request starts cleanly()",
              "reversing selected inputs preserves both records without reassigning one side()",
              "caller mutation and stream closure cannot change admitted records or retained results()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib.get("name") for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or set(names) != expected or len(names) != len(expected):
              raise SystemExit("Missing, foreign or repeated selected-cost regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")) or any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Selected-cost regressions did not execute cleanly")
          print(f"Verified {len(cases)} selected historical cost admissions; pricing comparability remains unestablished")
          PYTEST
      - name: Require explicitly supplied historical findings regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.comparison.RecordedFindingsComparisonTest"
          expected = {
              "default comparison keeps reports not loaded and never claims an empty evaluation()",
              "explicit absent inputs remain unavailable without consuming the other input()",
              "full frozen golden is admitted and preserves all forty five recorded findings()",
              "expected report identity is required independently of valid Build binding()",
              "stale revision or recorded locks reject without latest data substitution()",
              "a report admitted to one full Build cannot be relabeled onto equal IDs and locks()",
              "separately admitted Build changes are disclosed without inventing finding changes()",
              "all admitted streams remain caller owned and mutable source trees cannot alter records()",
              "unsupported ruleset is distinguished only after complete strict parsing()",
              "unsupported report remains separate from malformed or unsupported ruleset inputs()",
              "supported records still require the unchanged fixed schemas()",
              "size bounds and provider failures reject without private error text or closing streams()",
              "duplicate missing reordered or wrong selection findings fail reference admission()",
              "schema valid ready and contradictory results cannot become admitted comparison inputs()",
              "recorded outcome transitions expose counters and declarations without a new verdict()",
              "severity code message remediation and literal control text remain complete changes()",
              "absent evidence and supplied empty evidence remain different with both full inputs()",
              "evidence absent null string and typed values are never collapsed()",
              "evidence duplicate paths order and empty source version are preserved()",
              "exact numeric evidence equality avoids both spelling changes and floating point collapse()",
              "rule ID display join reports additions removals and changed association without guessing()",
              "changed affected selections are retained as ordered recorded IDs()",
              "catalog graph rules and pricebook locks are disclosed independently of finding values()",
              "same ruleset identity with a different expression is an integrity difference not an evaluation()",
              "distinct report identities and recorded times are not mistaken for freshness()",
              "finding budget never returns partial success even when most findings are unchanged()",
              "swapping inputs reverses additions and full before after values()",
              "collections and debug summaries cannot mutate or disclose private comparison values()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib.get("name") for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or set(names) != expected or len(names) != len(expected):
              raise SystemExit("Missing, foreign or repeated historical-findings regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")) or any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Historical-findings regressions did not execute cleanly")
          print(f"Verified {len(cases)} explicit historical-report comparisons; no new evaluation or freshness acceptance")
          PYTEST
      - name: Require recorded exact-product arithmetic regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.pricing.RecordedCostArithmeticTest"
          expected = {
              "decimal multiplication and comparison are exact without binary float drift()",
              "computed trailing zeros do not invent a precision failure or alter input lexemes()",
              "unrepresentable finite products remain exact and explicitly outside the profile()",
              "zero quantity or price does not prove free treatment or accepted coverage()",
              "recorded quantities stay in their meter units without new usage or discount inference()",
              "vendor quotes and manual overrides retain their declarations when products differ()",
              "schema admitted literal quantity stays unsupported without trimming or rejection()",
              "both operand boundaries permit a complete maximal product without truncation()",
              "oversized quantity price and declared amount are explicitly uninspected()",
              "repeated observations are stable and diagnostics do not expose recorded values()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib.get("name") for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or set(names) != expected or len(names) != len(expected):
              raise SystemExit("Missing, foreign or repeated exact-product arithmetic regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")) or any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Exact-product arithmetic regressions did not execute cleanly")
          print(f"Verified {len(cases)} recorded-product arithmetic tests; no quote or billing acceptance")
          PYTEST
      - name: Require exact recorded-resource Core receiving regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.resources.RecordedResourceInspectionTest"
          path = pathlib.Path("core/build/test-results/test") / ("TEST-" + name + ".xml")
          suite = ET.parse(path).getroot()
          required = {
              "canonical records retain all fields and explicit applicability gaps()",
              "different build identity or exact revision is rejected without substitution()",
              "integral spellings bind exactly while fractional and normalized oversize revisions fail()",
              "duplicate build selection IDs stop before reading the estimate()",
              "unknown and disabled references are rejected by the receiver not the wire decoder()",
              "unreferenced active choices remain visible without inventing required metric coverage()",
              "changed artifact runtime context and topology cannot establish applicability by matching IDs()",
              "declared verified confidence old time and mismatched units never become measured approval()",
              "decimal spelling duplicate rows assumptions and absent source remain exact()",
              "input identity covers every consumed byte and distinguishes layout without changing values()",
              "snapshots and nested collections stay immutable after callers alter their inputs()",
              "invalid and future schemas preserve side specific typed failures()",
              "malformed bytes trailing objects and bounded input failures never inspect partial records()",
              "streams remain caller owned with ordered reads and sanitized IO rejection()",
          }
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing, foreign or repeated resource inspection regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Resource inspection suite did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Resource inspection regression did not pass")
          print(f"Verified {len(cases)} recorded resource inspection cases; no capacity or installed-device qualification")
          PYTEST
      - name: Require complete local current-alternative Core observations
        run: |
          python - <<'PYALTERNATIVECORE'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.evaluation.DraftAlternativeInspectionTest"
          required = {
              "replacementKeepsEveryCurrentCandidateAndSlotEmptyFindingInExactRuleOrder()",
              "replacingAnExistingConflictExposesFailToPassWithoutInventingAWholeDraftVerdict()",
              "inheritedFoundationFailureAndCandidateUnknownStayDistinctFromTheCompatibleVerdict()",
              "secondaryReplacementKeepsThePrimaryLinksAndExactTypedWorkloadAcrossEveryContext()",
              "unchangedChoiceKeepsAllObservationsAndUnrepresentedPrivateFieldsOutOfRuleContext()",
              "equalLookingForeignRequestsResultsAndOptionsCannotReplaceCapturedMembership()",
              "capturedArtifactsAndReturnedFindingsCannotBeMutatedThroughCallerCollections()",
              "optionalIntentStaysWithItsOwnerAndDisabledCurrentSelectionsRemainExplicit()",
              "unsupportedCurrentOperandCannotBeSubstitutedWithTheSuccessfulSlotEmptyBasis()",
              "workLimitsCancellationAndInconsistentOriginalOutputNeverReturnPartialRows()",
              "realSavedObjectiveChangeRetiresOldAuthorityAndOnlyAFreshExplicitCommandCanWrite()",
              "unchangedFailOutcomesStillExposeChangedSelectionAssociationsAndLiteralDetails()",
          }
          report = pathlib.Path("core/build/test-results/test") / f"TEST-ai.pickyour.core.evaluation.DraftAlternativeInspectionTest.xml"
          suite = ET.parse(report).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
              raise SystemExit("Foreign alternative inspection report")
          if not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing or repeated alternative inspection case")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) for key in ("failures", "errors", "skipped")):
              raise SystemExit("Alternative inspection report totals contradict passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Alternative inspection case did not pass")
          print(f"Verified {len(cases)} local alternative observation cases; no installed or readiness claim")
          PYALTERNATIVECORE
      - name: Require typed private-draft compatible-option regressions
        run: |
          python - <<'PYCANDIDATES'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.evaluation.DraftCompatibleOptionsTest"
          required = {
              "emptyStoredDraftKeepsFoundationFailureAndSeparatesNewFailureAndUnknown()",
              "oneSelectionReplacementAndTwoSelectionBaselineUsePrivateAdmissionOnly()",
              "storedSecondaryNeverPromotesIntoAnEmptiedPrimaryAndRealConflictsRemain()",
              "secondaryReplacementPreservesTheOriginalPrimaryAndExactIncidentLinks()",
              "absentSharedIdentityPolicyAndObjectiveValuesAreNeverSynthesized()",
              "enteredWorkloadValuesPreserveExactDecimalsAndMissingValuesRemainUnknown()",
              "currentCompleteTypedFindingsEqualTheExistingFrozenInterpreter()",
              "rawFloatingCandidateOperandRejectsTheWholeBatchWithoutPartialOptions()",
              "artifactHashIdentityVersionAndExistingSelectionKindMismatchRejectBeforeEvaluation()",
              "invalidSlotsDuplicateCandidatesAndRegistryCardinalityCannotBecomeImplicitAdds()",
              "candidateCountWorkBudgetAndCancellationWithholdTheEntireResult()",
              "capturedInputsAndReturnedCollectionsCannotBeMutatedThroughCallerObjects()",
              "sameStoredHashInDifferentStoresAndChangedRuleBytesHaveDifferentBindings()",
              "realStoredEditAndRoleChangeRetireEarlierResultsBeforeQueuedStartOrDelivery()",
              "repeatedSameByteCaptureRetryAndCancelRejectForeignAttemptAuthority()",
              "staleCandidateDoesNotBypassTheActualStoreCommandRevisionGuard()",
              "nativeAdapterCapturesOnlyTheAcknowledgedRecordAndRejectsOtherRecordMembership()",
              "typedNativeBridgeKeepsExactArtifactPinsAndRawFloatingSelectionSemantics()",
              "realOptionalIntentWithholdsContradictionsButAllowsFillingEnabledEmptySlots()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
              raise SystemExit("Foreign private-draft candidate results")
          if set(names) != required or len(names) != len(required):
              raise SystemExit("Missing, unexpected or repeated private-draft candidate regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) for key in ("failures", "errors", "skipped")):
              raise SystemExit("Private-draft candidate totals contradict passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Private-draft candidate regression did not pass")
          print(f"Verified {len(cases)} typed private-draft candidate cases; no shared Build admission or native claim")
          PYCANDIDATES
      - name: Require environment admission core regressions
        run: |
          python - <<'PYENVIRONMENT'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = 'ai.pickyour.core.configuration.ClientEnvironmentAdmissionTest'
          expected = {
              'accepted preview exposes only finite configured identity and no remote authority()',
              'real modes reject even plausible self declared endpoint identity and capabilities()',
              'unknown and missing mode never default to preview or consume configuration()',
              'missing configuration never manufactures preview defaults()',
              'environment mismatch rejects independently of valid preview metadata()',
              'actual package version and code must all match the admitted profile()',
              'wrong contract catalog schema and configured catalog identity reject before use()',
              'preview forbids endpoints and API declarations including empty strings()',
              'capabilities cannot be added duplicated omitted or type coerced()',
              'closed fields reject credentials unknown keys and missing explicit nulls()',
              'duplicate escaped keys trailing roots invalid UTF8 and excessive nesting reject()',
              'actual byte budget bounds reads and malformed or IO failures contain no input()',
              'format and required scalar types are never guessed or coerced()',
              'rejected read leaves caller stream open and fresh valid read can recover()',
          }
