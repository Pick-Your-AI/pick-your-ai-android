name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Frozen contracts and JVM core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Verify frozen import and reference conformance
        run: python scripts/check_contracts.py
      - name: Verify versioned synthetic scenario data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/check_preview_scenarios.py
          python -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
          python -O -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
      - name: Prove tampering fails closed
        run: python -m unittest discover -s tests -v
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Verify pinned conformance inputs and adversarial receipt guards
        run: |
          python scripts/check_conformance_fixtures.py
          python -m unittest discover -s scripts/tests -p 'test_conformance_fixtures.py' -v
      - name: Verify runtime SPDX mapping and stale-evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_runtime_sbom.py' -v
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile and test JVM core
        run: ./gradlew --no-daemon --dependency-verification=strict --init-script scripts/runtime_inventory.init.gradle.kts :core:check :core:assemble runtimeInventory
      - name: Require complete retained-snapshot and frozen evaluator regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          expected = {
              'ai.pickyour.core.preview.PreviewCatalogRetentionTest': {
                  'retained pins survive replacement and reopen without changing another cache head()',
                  'invalid unsupported and oversized snapshots never provision a cache()',
                  'quota preserves all older pins and allows exact reuse without activation()',
                  'missing root and foreign child preserve bytes until explicit repair()',
                  'symbolic link roots and children never receive catalog writes()',
                  'failed provisioning cannot acknowledge or publish and permits a fresh retry()',
                  'readable interrupted pin requires directory sync before acknowledgement and retry preserves head()',
                  'failed and uncertain publication preserve old pins and require separate reread()',
                  'busy retention fails promptly without replacing existing snapshot()',
                  'cancellation does no work and an explicit later request can proceed()',
                  'corrupt immutable content is reported without repair or replacement()',
                  'caller array mutations cannot rewrite retained original bytes()',
              },
              'ai.pickyour.core.evaluation.RetainedSnapshotEvaluationTest': {
                  'actual retained bundle reproduces the complete no-evidence Python golden and keeps both times()',
                  'request captures every exact pin and remains independent of copied bytes and source deletion()',
                  'mathematical revisions above Long remain exact in request report and digest()',
                  'same Build bytes with different retained-only source and retry authority stay distinct()',
                  'retained Pricebook changes exact input identity without supplying cost metrics()',
                  'missing requested evidence does not erase independently checked supplied evidence()',
                  'even fully bound declared complete and calibrated estimates are explicitly withheld()',
                  'optional evidence distinguishes malformed wrong-version wrong-type foreign and wrong-hash inputs()',
                  'malformed Build and foreign exact graph locks reject without hiding other binding diagnostics()',
                  'original artifact hash mismatch rejects before a report can be prepared()',
                  'schema-valid integral decimal Build spelling stays explicitly unsupported by the local evaluator()',
                  'unknown profile and reader budgets withhold instead of silently selecting another version()',
                  'cancelled work and unavailable observation clock do not return a report()',
              },
              'ai.pickyour.core.preview.PreviewSnapshotAnalysisTest': {
                  'real archived input runs on the worker and only the delivered request becomes current()',
                  'cancel before queued read prevents evaluation and late work cannot restore state()',
                  'cancel after computation but before delivery rejects the completed report()',
                  'switching snapshots prevents an older delivered result from replacing the selected identity()',
                  'same entry retry and ABA selection require new opaque request authority()',
                  'a real result for another Build or revision is rejected by the active delivery boundary()',
                  'a result from an equivalent earlier request cannot complete a newer attempt()',
                  'source deletion does not revoke an independently retained historical read()',
                  'captured old index permits historical inspection without repairing missing current index()',
                  'foreign archive receipt and missing retained bytes never select a replacement()',
                  'unsupported numeric profile produces a recoverable explicit failure()',
                  'worker and delivery rejection expose failure instead of an apparent current result()',
                  'evaluator and observer exceptions cannot manufacture a report or strand a completed attempt()',
                  'close retires both queued phases and cannot be reopened by an old or fresh caller()',
              },
              'ai.pickyour.core.drafts.SnapshotArchiveInspectionTest': {
                  'inspection cannot initialize an unused namespace or reconstruct a lost seal or index()',
                  'inspection captures the exact existing index without activation or source liveness()',
              },
              'ai.pickyour.core.evaluation.FrozenDiagnosticEvaluatorTest': {
                  'raw numeric spelling reaches the strict reader unchanged()',
                  'streams remain open and repeated runs have independent budgets()',
                  'ambiguous selections remain unknown without guessing first match()',
                  'derived VRAM accepts exact 28 digits and rejects a rounded 29 digit product()',
                  'string scans charge their full work before execution()',
                  'foreign catalog and rules locks reject before report creation()',
                  'schema valid swapped catalog identities reject kind mismatch()',
                  'raw floating and exponent operands reject even nested or opposite missing()',
                  'original-strict-False',
                  'original-strict-True',
                  'decimal-equal',
                  'decimal-boundary',
                  'decimal-zero',
                  'decimal-string-nonnumeric',
                  'bool-python-equality',
                  'nested-container-equality',
                  'nested-no-string-coercion',
                  'nested-containment',
                  'substring',
                  'empty-substring',
                  'in-array',
                  'subset',
                  'intersection',
                  'empty-intersection',
                  'missing',
                  'all-false-dominates',
                  'any-true-dominates',
                  'not-unknown',
                  'implies-false',
                  'exists-null',
                  'exists-false',
                  'skipped',
                  'unknown-applicability',
                  'warning-failure',
                  'set operands stay unsupported with opposite missing()',
                  'duplicate identities reject across all three documents()',
                  'budget exhaustion never emits a partial compatible report()',
                  'unsupported version and malformed field reject()',
                  'selected item version mismatch is rejected before metrics()',
                  'reference exceptions stay unsupported rather than invented verdicts()',
                  'recursive container containment charges nested comparisons()',
                  'nested string comparisons consume containment work()',
                  'float encoded identity revisions remain unsupported()',
                  'ASCII array pointer preserves leading zeros and missing paths()',
              },
          }
          total = 0
          for name, required in expected.items():
              path = pathlib.Path('core/build/test-results/test') / ("TEST-" + name + ".xml")
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib["name"] for case in cases]
              if suite.attrib.get("name") != name or not required <= set(names) or len(names) != len(set(names)):
                  raise SystemExit("Missing, foreign or repeated retained-snapshot regression")
              if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit("Retained-snapshot suite did not execute cleanly")
              if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
                  raise SystemExit("Retained-snapshot regression did not pass")
              total += len(cases)
          print(f"Verified {total} retained-snapshot and frozen evaluator cases; native execution remains separate")
          PYTEST
      - name: Require parser-derived workload field feedback regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = "ai.pickyour.core.preview.PreviewWorkloadValidationTest"
          report = pathlib.Path("core/build/test-results/test/TEST-" + qualified + ".xml")
          suite = ET.parse(report).getroot()
          required = {
              "emptyInputsStayUnansweredAndEveryTypedClassificationIsValid()",
              "independentInvalidFieldsDoNotBlameValidOrUnansweredValues()",
              "budgetFeedbackPreservesCanonicalDecimalPrecisionAndRejectsLocaleCoercion()",
              "integerFeedbackUsesExactBoundsAndNeverTreatsUnknownAsAMeasurement()",
              "textLimitsUseTheExistingStringBudgetWithoutTrimmingOrTruncation()",
              "currencyFeedbackUsesTheExistingFullUppercasePattern()",
              "rejectedWholeEditRemainsAFormFailureWithoutInventingAFieldFailure()",
              "feedbackIsImmutableValueFreeAndIndependentOfLaterCorrections()",
          }
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != qualified or any(case.attrib.get("classname") != qualified for case in cases):
              raise SystemExit("Wrong workload field feedback suite")
          if not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing or repeated workload field feedback regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Workload field feedback totals do not match passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Workload field feedback regression did not pass")
          print(f"Verified {len(cases)} parser-derived workload field feedback cases")
          PYTEST
      - name: Require every retained configuration golden
        run: |
          python - <<'PYCONFIGURATION'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              "all-active-control",
              "contradictory-target-region",
              "contradictory-host-region",
              "contradictory-self-hosted-serving",
              "optional-t3-t4-t5-disabled",
              "optional-t3-enabled",
              "optional-t4-enabled-without-t3-vector",
              "optional-t5-enabled",
              "rag-with-disabled-knowledge",
              "agent-with-disabled-framework",
              "training-with-disabled-compute",
              "production-with-disabled-guardrail",
              "development-with-disabled-guardrail",
              "hard-cap-disabled-without-cost",
              "zero-budget-without-cost",
              "precise-budget-without-cost",
              "adjacent-budget-without-cost",
          }
          name = "ai.pickyour.core.evaluation.RetainedConfigurationGoldenTest"
          path = pathlib.Path("core/build/test-results/test") / ("TEST-" + name + ".xml")
          suite = ET.parse(path).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or set(names) != required or len(names) != len(required):
              raise SystemExit("Missing, foreign or repeated retained configuration golden")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) for key in ("failures", "errors", "skipped")):
              raise SystemExit("Retained configuration goldens did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Retained configuration golden did not pass")
          print(f"Verified all {len(cases)} complete retained configuration goldens")
          PYCONFIGURATION
      - name: Require every conformance fixture and private migration observation
        run: |
          mkdir -p build/conformance
          python scripts/check_conformance_fixtures.py --reports core/build/test-results/test --exit-code 0 --output build/conformance/qualified.json
      - name: Reject ignored packaged contract schemas
        run: python scripts/check_runtime_inventory_guards.py
      - name: Require actual inventory producer to reject Git replacement objects
        run: python scripts/check_runtime_inventory_source.py
      - name: Export and validate the current runtime SPDX document
        run: python scripts/runtime_sbom.py
      - name: Retain test and library artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-verification-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            core/build/libs/
            build/inventory/
            build/conformance/
            build/sbom/
          retention-days: 7
          if-no-files-found: ignore
  android-preview:
    name: Unsigned synthetic Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Ensure experimental SDK inputs
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile unsigned preview, run lint and simulated UI tests
        run: ./gradlew --no-daemon --dependency-verification=strict --init-script scripts/runtime_inventory.init.gradle.kts -PandroidPreview=true :preview:assembleDebug :preview:lintDebug :preview:testDebugUnitTest runtimeInventory
      - name: Reject ignored packaged preview assets
        run: python scripts/check_runtime_inventory_guards.py --preview
      - name: Export and validate the current runtime SPDX document
        run: python scripts/runtime_sbom.py
      - name: Inspect the packaged synthetic preview policy
        run: |
          python -m unittest discover -s scripts/tests -p 'test_preview_policy.py'
          python scripts/check_preview_policy.py --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          python scripts/check_preview_policy_guards.py --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Require synthetic scenario admission regressions to execute
        run: |
          python - <<'PYSCENARIOS'
          import pathlib
          import xml.etree.ElementTree as ET
          class_name = "ai.pickyour.android.preview.SyntheticScenarioDataTest"
          report = pathlib.Path("preview/build/test-results/testDebugUnitTest") / f"TEST-{class_name}.xml"
          suite = ET.parse(report).getroot()
          expected = {
              "allFiveSamplesRetainSyntheticVersionAndDistinctInputIdentity",
              "emptySampleIsOnlyAnExpectedSchemaRejectionWithoutAnAcceptedBuildOrReport",
              "allDiagnosticFieldsMatchActualFrozenPythonReferenceAndRetainUnknowns",
              "coreSampleKeepsT6AndDisablesOnlyTheFourteenOptionalSelections",
              "partialQuoteKeepsRecordedMoneyUnpricedAndUnclassifiedEvidenceSeparate",
              "manifestVersionsMalformedBytesAndSelfDeclaredReplacementHashesCannotBeAdmitted",
              "eachMissingChangedOrSwappedInputRejectsBeforeAnUnrelatedSampleCanSucceed",
              "byteBudgetsFailClosedBeforeAnyFixtureEvaluation",
              "acceptedResultCannotBeReboundByLaterCallerArrayOrMapMutation",
              "deliveryPlansAreImmutableFiniteDefinitionsWithExplicitRetryAndNewerFirstOrder",
          }
          cases = suite.findall("testcase")
          if suite.get("name") != class_name or len(cases) != len(expected) or {case.get("name") for case in cases} != expected:
              raise SystemExit("Synthetic scenario reader cases are missing, duplicated or unexpected")
          if any(case.get("classname") != class_name or any(case.find(tag) is not None for tag in ("failure", "error", "skipped")) for case in cases):
              raise SystemExit("Synthetic scenario reader case did not execute and pass")
          print(f"All {len(expected)} synthetic scenario reader cases executed and passed; no scenario UI or installed-device inference.")
          PYSCENARIOS
      - name: Require automatic form-save regressions to execute
        run: |
          python - <<'PYAUTOSAVE'
          import pathlib
          import xml.etree.ElementTree as ET
          class_name = "ai.pickyour.android.preview.PreviewAutosaveActivityTest"
          suite = ET.parse(pathlib.Path("preview/build/test-results/testDebugUnitTest") / f"TEST-{class_name}.xml").getroot()
          expected = {
              "initialLoadAndIdleDoNotCreateAnUneditedDraft",
              "rapidChangesAutosaveOnlyTheCompleteLatestFormAfterThePause",
              "manualSaveConsumesThePendingDelayWithoutDuplicatingARevision",
              "editingDuringAutosaveKeepsNewInputsUntilTheirOwnDurableAcknowledgement",
              "invalidWorkloadCancelsThePendingSaveAndCorrectionCommitsTheWholeForm",
              "failedAutosavePreservesTheHeadAndPauseAcrossRecreationUntilExplicitRetry",
              "aConcurrentWriterBlocksAutomaticRetryAndRecreationCannotAdoptItsAuthority",
              "aLibraryOpeningFailureRequiresExplicitReconciliationBeforeAutosaveCanResume",
              "autosaveRetiresVisibleInspectionAndPreservesNewerInputUntilItsOwnAcknowledgement",
              "recreationBeforeTheDelayRetainsPendingInputAndOnlyTheNewEditorCanSaveIt",
              "aCommittedWriteWithoutUiAcknowledgementRequiresExplicitReconciliationAfterRecreation",
              "selectingANewDraftRetiresThePriorTimerAndItsPendingInput",
              "aRejectedWorkerNeverAcknowledgesOrAutomaticallyRetriesAnUndispatchedWrite",
          }
          cases = suite.findall("testcase")
          if suite.get("name") != class_name or len(cases) != len(expected) or {case.get("name") for case in cases} != expected:
              raise SystemExit("Automatic form-save regressions are missing, duplicated or unexpected")
          if int(suite.get("tests", "-1")) != len(cases) or any(int(suite.get(key, "-1")) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Automatic form-save suite did not report complete zero-failure execution")
          if any(case.get("classname") != class_name or any(case.find(tag) is not None for tag in ("failure", "error", "skipped")) for case in cases):
              raise SystemExit("Automatic form-save case did not execute and pass")
          print(f"All {len(expected)} automatic form-save simulations executed and passed; no installed-process inference.")
          PYAUTOSAVE
      - name: Require all simulated UI regressions to execute
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path("preview/build/test-results/testDebugUnitTest/TEST-ai.pickyour.android.preview.PreviewActivityTest.xml")
          suite = ET.parse(report).getroot()
          expected = {
              "acknowledgedFieldsAndExplicitEmptySurviveRecreation",
              "newerDiskHeadCannotAdoptStalePendingFormAfterRecreation",
              "tierActivationRequiresCleanFormAndExplicitConfirmation",
              "comparisonDistinguishesLiteralSentinelWithoutWriting",
              "domainRestoreDisclosesTypedComponentsAndPreservesHistoryAndMetadata",
              "cancelledHistoryDialogsCannotReplaceFieldsOrReopenChildren",
              "cancelledDomainRestoreCannotCommitOrReplacePendingInputs",
              "editorsExposeLabelsAndSavedStatusUsesTextAndLiveRegion",
              "confirmedCurrentDraftDeletionRetainsPendingFormAndRevokesSaveAuthority",
              "catalogQuerySurvivesDetailsAndRecreationWithoutChangingPinnedSelection",
              "emptyCatalogSearchCanRecoverAndReloadUsesTheCurrentQuery",
              "interruptedFinalCleanupCanBeRetriedAfterRecreationWithoutLibraryRow",
              "retiredCleanupRetryCannotOpenConfirmationAfterRecreation",
              "retiredCleanupConfirmationCannotDispatchAfterRecreation",
              "retainedConfirmationCannotReplaceAnotherPendingCleanup",
              "retainedConfirmationUsesCurrentSameIdCleanupAuthority",
              "canceledCleanupConfirmationCannotDeleteItsAcknowledgedDraft",
              "canceledCatalogFacetChoicesCannotChangeBrowsingState",
              "canceledCleanupRedirectCannotOpenRetryConfirmation",
              "canceledDomainRestoreCannotAppendRevisionOrReplaceInputs",
              "canceledDuplicateCannotCreateOrSwitch",
              "canceledFindingsPickerCannotOpenDetails",
              "canceledHistoryAndLibraryParentsCannotOpenFollowups",
              "canceledHistoryCopyCannotReplacePendingForm",
              "canceledLibrarySwitchCannotReplaceActiveIdentityOrForm",
              "canceledNewDraftCannotCreateOrSwitch",
              "canceledRecoveryCopyCannotCreateOrSwitch",
              "canceledReopenCannotDiscardPendingFields",
              "canceledTierChooserCannotOpenConfirmation",
              "canceledTierConfirmationCannotCommitActivation",
              "canceledWorkloadClassificationCannotChangePendingInput",
              "consumedReopenCannotDiscardLaterPendingFields",
              "largeTextRtlButtonsRetainMeasuredTargetsAndUntruncatedLabels",
              "forwardFocusOrderKeepsEditorsAndClearActionReachable",
              "catalogQuerySortAndPageSurviveDetailsAndRecreationWithoutChangingDraft",
              "catalogFacetsExposeEveryKindAndEmptyMatchesWithoutReplacingSavedSelection",
              "catalogDetailsCannotApplySelectionAfterEditorBaselineChanges",
              "findingsInspectionKeepsOutcomeSeveritySeparateAndNeverWritesDraft",
              "destroyedCatalogIgnoresRetainedEditorsDialogsAndRows",
              "destroyedFindingsIgnoreRetainedInspectBrowseAndPickerCallbacks",
              "destroyedCostIgnoresRetainedInspectControl",
              "workloadInputsRetainExactValuesAndInvalidPendingTextAcrossRecreation",
              "workloadRecreationRetainsStalePendingInputUntilExplicitReopen",
              "classificationIsExplicitAndClearRemainsAnUnsavedWorkloadEdit",
              "oversizedWorkloadPastesNeverSaveAValidPrefix",
              "retiredWorkloadClassificationCallbackCannotOpenAnotherDialog",
              "retiredWorkloadTextEditsCannotMutateItsModelOrCurrentDraft",
              "retiredWorkloadOversizedPasteCannotRejectItsModelOrCurrentDraft",
              "retiredEditorButtonsCannotDispatchWorkOrOpenDialogs",
              "retiredComparisonPickerCannotSubmitToClosedWorker",
              "retiredTierConfirmationCannotCommitAfterRecreation",
              "conflictingPendingInputsCanBeCopiedWithoutChangingNewerOriginal",
              "invalidOrChangedPendingInputsAndRetiredConfirmationCannotCreateRecovery",
              "requiredObjectiveGuidanceNavigatesMissingInputsWithoutClaimingReadiness",
              "retiredObjectiveGuidanceCannotOpenClassificationOrChangeCurrentInputs",
              "catalogDetailShowsPinnedSpecsEvidenceAndLicenseWithoutSaving",
              "catalogComparisonTrayRetainsExactPinsAcrossDetailsBackAndRecreationWithoutSaving",
              "catalogComparisonDifferencesKeepVersionsConditionsAndUnknownFieldsVisible",
              "catalogComparisonPreservesRecordedPriceSnapshotsAndUnknownRecoveryWithoutSaving",
              "catalogComparisonKeepsUnavailablePinsAndRejectsAnOldDetailAfterSnapshotReplacement",
              "retiredCatalogComparisonControlsCannotMutateStateOrOpenDialogs",
              "invalidCatalogComparisonRestorationIsExplicitAndPreservesPendingEditorInputs",
              "nonStringCatalogComparisonPinsResetWithoutLosingPendingDraftInputs",
              "catalogDetailsAndComparisonEscapeUnicodeSeparatorsWithoutChangingRecordedValues",
              "catalogComparisonStackedHeadingsAndToggleRemainMeasuredAtNarrowRtlLargeText",
              "catalogDetailKeepsLiteralUnknownIdentitySeparateFromUnknownSpec",
              "catalogDetailRenderingKeepsUnknownAndBoundedLiteralSourceValues",
              "retiredContextEditorsCannotChangeCapturedDomainState",
              "catalogSourceChooserIsExplicitAndMissingUriCannotDispatch",
              "catalogSourceConfirmationDispatchesOnlyExactUriAndNoDraftData",
              "cancelledSourceConfirmationAndRetiredChooserCannotDispatch",
              "catalogSourcePolicyRejectsHostileAndUnconfiguredUris",
              "catalogSourcePagingRetainsEveryExactProvenanceIndex",
              "unavailableSourceHandlerPreservesDraftAndRequiresNewConfirmation",
              "catalogSourceCallbackCannotDispatchAfterAuthorityChangeOrRecreation",
              "catalogSourceConfirmationShowsCompleteBoundedUri",
              "catalogRecordedPriceShowsExactSnapshotUnitsAndDatesWithoutSaving",
              "catalogDetailDialogsPreserveLiteralCatalogReferenceIds",
              "catalogRecordedPriceNeverSubstitutesMissingItemOrVersionWithFreePricing",
              "catalogRecordedPriceKeepsZeroConditionsAndUnknownLiteralsUnassessed",
              "catalogRecordedPriceBoundsLiteralAlternativesWithoutSelectingOrCombining",
              "catalogRecordedPriceReadFailureKeepsUnknownContextAndRetryUsesFreshSnapshot",
              "catalogRecordedPriceReloadAndRetiredDialogCannotChangePendingDraft",
              "explicitComponentsAddConfigureToggleAndRemovePreserveGuestInputs",
              "componentAddEditorsRequestLiteralInputAndNoLearning",
              "componentConfigureEditorRequestsLiteralInputWithoutSavingPendingText",
              "recreatedRoleEditorRetainsExactPendingInputAndImeRequests",
              "invalidComponentInputRemainsVisibleAndCannotCommitTruncatedPrefix",
              "staleComponentFormCannotOverwriteConcurrentSavedHead",
              "repeatedAndRetiredComponentConfirmationsCannotCreateAnotherRevision",
              "exactComponentReplacementNoopRetainsIdentityAndDirtyFormBlocksEntry",
              "canceledComponentDialogsAndPickersRevokeTheirRetainedCallbacks",
              "inFlightComponentCommitFreezesFormUntilInvalidOutcomeRestoresInputs",
          }
          cases = suite.findall("testcase")
          assert expected <= {case.attrib["name"] for case in cases}, "Missing UI regression"
          assert all(not case.findall("failure") and not case.findall("error") and not case.findall("skipped") for case in cases), "UI regression did not pass"
          assert int(suite.attrib["tests"]) >= len(expected)
          print(f"Verified {len(cases)} simulated Activity tests; no installed-device claim")
          cost_report = pathlib.Path("preview/build/test-results/testDebugUnitTest/TEST-ai.pickyour.android.preview.CostInspectionTextTest.xml")
          cost_suite = ET.parse(cost_report).getroot()
          expected_cost = {
              "localizesWideDecimalsWithoutRoundingAndKeepsCanonicalLexeme",
              "preservesTrailingZerosAndSmallNonzeroAmountsAcrossCurrencyConventions",
              "screenLocaleControlsDisplayIndependentlyOfProcessDefault",
              "hostileLiteralTextCannotReplaceLabelsAndLongTextIsExplicitlyTruncated",
              "boundedLinesAndListsDiscloseCountsWhileTotalsRetainEveryLine",
              "oversizedDecimalUsesBoundedCanonicalDisclosureWithoutAFalseRoundedAmount",
              "schemaPermittedTerminalNewlineQuantityRemainsLiteralWithoutCrashing",
              "absentLinesAndUnknownCoverageStayUnpricedWithoutManufacturedCompleteness",
