      - name: Retain unsigned diagnostic and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-preview-${{ github.sha }}
          path: |
            preview/build/outputs/apk/debug/*-unsigned.apk
