name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Frozen contracts and JVM core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference validator dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Verify frozen import and reference conformance
        run: python scripts/check_contracts.py
      - name: Verify versioned synthetic scenario data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/check_preview_scenarios.py
          python -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
          python -O -m unittest discover -s scripts/tests -p 'test_preview_scenarios.py' -v
      - name: Prove tampering fails closed
        run: python -m unittest discover -s tests -v
      - name: Verify delivery evidence ledger
        run: |
          python scripts/check_delivery_ledger.py
          python -m unittest discover -s scripts/tests -p 'test_delivery_ledger.py'
      - name: Verify emulator harness target and evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_android*.py' -v
      - name: Verify pinned conformance inputs and adversarial receipt guards
        run: |
          python scripts/check_conformance_fixtures.py
          python -m unittest discover -s scripts/tests -p 'test_conformance_fixtures.py' -v
      - name: Verify runtime SPDX mapping and stale-evidence guards
        run: python -m unittest discover -s scripts/tests -p 'test_runtime_sbom.py' -v
      - name: Check wrapper integrity
        run: sha256sum --check gradle/wrapper/wrapper.sha256
      - name: Compile and test JVM core
        run: ./gradlew --no-daemon --dependency-verification=strict --init-script scripts/runtime_inventory.init.gradle.kts :core:check :core:assemble runtimeInventory
      - name: Require recorded exact-product arithmetic regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.pricing.RecordedCostArithmeticTest"
          expected = {
              "decimal multiplication and comparison are exact without binary float drift()",
              "computed trailing zeros do not invent a precision failure or alter input lexemes()",
              "unrepresentable finite products remain exact and explicitly outside the profile()",
              "zero quantity or price does not prove free treatment or accepted coverage()",
              "recorded quantities stay in their meter units without new usage or discount inference()",
              "vendor quotes and manual overrides retain their declarations when products differ()",
              "schema admitted literal quantity stays unsupported without trimming or rejection()",
              "both operand boundaries permit a complete maximal product without truncation()",
              "oversized quantity price and declared amount are explicitly uninspected()",
              "repeated observations are stable and diagnostics do not expose recorded values()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib.get("name") for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or set(names) != expected or len(names) != len(expected):
              raise SystemExit("Missing, foreign or repeated exact-product arithmetic regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")) or any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Exact-product arithmetic regressions did not execute cleanly")
          print(f"Verified {len(cases)} recorded-product arithmetic tests; no quote or billing acceptance")
          PYTEST
      - name: Require exact recorded-resource Core receiving regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.resources.RecordedResourceInspectionTest"
          path = pathlib.Path("core/build/test-results/test") / ("TEST-" + name + ".xml")
          suite = ET.parse(path).getroot()
          required = {
              "canonical records retain all fields and explicit applicability gaps()",
              "different build identity or exact revision is rejected without substitution()",
              "integral spellings bind exactly while fractional and normalized oversize revisions fail()",
              "duplicate build selection IDs stop before reading the estimate()",
              "unknown and disabled references are rejected by the receiver not the wire decoder()",
              "unreferenced active choices remain visible without inventing required metric coverage()",
              "changed artifact runtime context and topology cannot establish applicability by matching IDs()",
              "declared verified confidence old time and mismatched units never become measured approval()",
              "decimal spelling duplicate rows assumptions and absent source remain exact()",
              "input identity covers every consumed byte and distinguishes layout without changing values()",
              "snapshots and nested collections stay immutable after callers alter their inputs()",
              "invalid and future schemas preserve side specific typed failures()",
              "malformed bytes trailing objects and bounded input failures never inspect partial records()",
              "streams remain caller owned with ordered reads and sanitized IO rejection()",
          }
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases) or not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing, foreign or repeated resource inspection regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Resource inspection suite did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Resource inspection regression did not pass")
          print(f"Verified {len(cases)} recorded resource inspection cases; no capacity or installed-device qualification")
          PYTEST
      - name: Require typed private-draft compatible-option regressions
        run: |
          python - <<'PYCANDIDATES'
          import pathlib
          import xml.etree.ElementTree as ET
          name = "ai.pickyour.core.evaluation.DraftCompatibleOptionsTest"
          required = {
              "emptyStoredDraftKeepsFoundationFailureAndSeparatesNewFailureAndUnknown()",
              "oneSelectionReplacementAndTwoSelectionBaselineUsePrivateAdmissionOnly()",
              "storedSecondaryNeverPromotesIntoAnEmptiedPrimaryAndRealConflictsRemain()",
              "secondaryReplacementPreservesTheOriginalPrimaryAndExactIncidentLinks()",
              "absentSharedIdentityPolicyAndObjectiveValuesAreNeverSynthesized()",
              "enteredWorkloadValuesPreserveExactDecimalsAndMissingValuesRemainUnknown()",
              "currentCompleteTypedFindingsEqualTheExistingFrozenInterpreter()",
              "rawFloatingCandidateOperandRejectsTheWholeBatchWithoutPartialOptions()",
              "artifactHashIdentityVersionAndExistingSelectionKindMismatchRejectBeforeEvaluation()",
              "invalidSlotsDuplicateCandidatesAndRegistryCardinalityCannotBecomeImplicitAdds()",
              "candidateCountWorkBudgetAndCancellationWithholdTheEntireResult()",
              "capturedInputsAndReturnedCollectionsCannotBeMutatedThroughCallerObjects()",
              "sameStoredHashInDifferentStoresAndChangedRuleBytesHaveDifferentBindings()",
              "realStoredEditAndRoleChangeRetireEarlierResultsBeforeQueuedStartOrDelivery()",
              "repeatedSameByteCaptureRetryAndCancelRejectForeignAttemptAuthority()",
              "staleCandidateDoesNotBypassTheActualStoreCommandRevisionGuard()",
              "nativeAdapterCapturesOnlyTheAcknowledgedRecordAndRejectsOtherRecordMembership()",
              "typedNativeBridgeKeepsExactArtifactPinsAndRawFloatingSelectionSemantics()",
              "realOptionalIntentWithholdsContradictionsButAllowsFillingEnabledEmptySlots()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test") / f"TEST-{name}.xml").getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
              raise SystemExit("Foreign private-draft candidate results")
          if set(names) != required or len(names) != len(required):
              raise SystemExit("Missing, unexpected or repeated private-draft candidate regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) for key in ("failures", "errors", "skipped")):
              raise SystemExit("Private-draft candidate totals contradict passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Private-draft candidate regression did not pass")
          print(f"Verified {len(cases)} typed private-draft candidate cases; no shared Build admission or native claim")
          PYCANDIDATES
      - name: Require environment admission core regressions
        run: |
          python - <<'PYENVIRONMENT'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = 'ai.pickyour.core.configuration.ClientEnvironmentAdmissionTest'
          expected = {
              'accepted preview exposes only finite configured identity and no remote authority()',
              'real modes reject even plausible self declared endpoint identity and capabilities()',
              'unknown and missing mode never default to preview or consume configuration()',
              'missing configuration never manufactures preview defaults()',
              'environment mismatch rejects independently of valid preview metadata()',
              'actual package version and code must all match the admitted profile()',
              'wrong contract catalog schema and configured catalog identity reject before use()',
              'preview forbids endpoints and API declarations including empty strings()',
              'capabilities cannot be added duplicated omitted or type coerced()',
              'closed fields reject credentials unknown keys and missing explicit nulls()',
              'duplicate escaped keys trailing roots invalid UTF8 and excessive nesting reject()',
              'actual byte budget bounds reads and malformed or IO failures contain no input()',
              'format and required scalar types are never guessed or coerced()',
              'rejected read leaves caller stream open and fresh valid read can recover()',
          }
          path = pathlib.Path('core/build/test-results/test') / ("TEST-" + qualified + ".xml")
          suite = ET.parse(path).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != qualified or not expected <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing, foreign or duplicate environment regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(k, "0")) for k in ("failures", "errors", "skipped")):
              raise SystemExit("Environment regressions did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Environment regression failed or skipped")
          print(f"Verified {len(cases)} environment admission cases")
          PYENVIRONMENT
      - name: Require bounded component route parser regressions to execute
        run: |
          python - <<'PYROUTE'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              'ai.pickyour.core.preview.PreviewComponentRouteTest': {
                  'the four explicit fields survive parsing with exact opaque version spelling()',
                  'parameter order transport case and hex spelling do not change identity()',
                  'only the exact private route authority and path are recognized()',
                  'unknown duplicate missing empty and encoded parameter keys reject the complete route()',
                  'reserved delimiters are unambiguous and values are decoded only once()',
                  'malformed UTF8 never becomes replacement characters or a different version()',
                  'raw nonASCII whitespace backslashes and decoded control characters reject()',
                  'only frozen canonical kinds and bounded canonical item identifiers are accepted()',
                  'version budget counts strict UTF8 bytes without trimming or Unicode normalization()',
                  'snapshot identity requires exactly a full hexadecimal digest()',
                  'empty and oversized raw entry is rejected before any catalog use()',
                  'normalized checkpoint restoration repeats every identity admission check()',
                  'matching requires the exact kind item version and raw snapshot identity()',
                  'diagnostics disclose no incoming version or identity()',
              },
          }
          for name, expected in required.items():
              path = pathlib.Path('core/build/test-results/test') / ("TEST-" + name + ".xml")
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib["name"] for case in cases]
              if suite.attrib.get("name") != name or any(case.attrib.get("classname") != name for case in cases):
                  raise SystemExit("Unexpected component route regression owner")
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit("Missing, unexpected or repeated component route regression")
              if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit("Component route suite did not execute cleanly")
              if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
                  raise SystemExit("Component route regression did not pass")
              print(f"Verified {len(cases)} JVM {name} cases; no installed-device claim")
          PYROUTE
      - name: Require complete retained-snapshot and frozen evaluator regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          expected = {
              'ai.pickyour.core.evaluation.CompatibleOptionsAbsentLockCausalReplayTest': {
                  'presentOptionalLockRetainsItsExactIdentityThroughEvaluationAndDelivery()',
                  'omittedOptionalLockRemainsAbsentThroughAdmittedEvaluationAndDelivery()',
                  'explicitNullLockRemainsRejectedByTheUnchangedFrozenBoundary()',
              },
              'ai.pickyour.core.preview.PreviewCatalogRetentionTest': {
                  'retained pins survive replacement and reopen without changing another cache head()',
                  'invalid unsupported and oversized snapshots never provision a cache()',
                  'quota preserves all older pins and allows exact reuse without activation()',
                  'missing root and foreign child preserve bytes until explicit repair()',
                  'symbolic link roots and children never receive catalog writes()',
                  'failed provisioning cannot acknowledge or publish and permits a fresh retry()',
                  'readable interrupted pin requires directory sync before acknowledgement and retry preserves head()',
                  'failed and uncertain publication preserve old pins and require separate reread()',
                  'busy retention fails promptly without replacing existing snapshot()',
                  'cancellation does no work and an explicit later request can proceed()',
                  'corrupt immutable content is reported without repair or replacement()',
                  'caller array mutations cannot rewrite retained original bytes()',
              },
              'ai.pickyour.core.evaluation.RetainedSnapshotEvaluationTest': {
                  'actual retained bundle reproduces the complete no-evidence Python golden and keeps both times()',
                  'request captures every exact pin and remains independent of copied bytes and source deletion()',
                  'mathematical revisions above Long remain exact in request report and digest()',
                  'same Build bytes with different retained-only source and retry authority stay distinct()',
                  'retained Pricebook changes exact input identity without supplying cost metrics()',
                  'missing requested evidence does not erase independently checked supplied evidence()',
                  'even fully bound declared complete and calibrated estimates are explicitly withheld()',
                  'optional evidence distinguishes malformed wrong-version wrong-type foreign and wrong-hash inputs()',
                  'malformed Build and foreign exact graph locks reject without hiding other binding diagnostics()',
                  'original artifact hash mismatch rejects before a report can be prepared()',
                  'schema-valid integral decimal Build spelling stays explicitly unsupported by the local evaluator()',
                  'unknown profile and reader budgets withhold instead of silently selecting another version()',
                  'cancelled work and unavailable observation clock do not return a report()',
              },
              'ai.pickyour.core.preview.PreviewSnapshotAnalysisTest': {
                  'real archived input runs on the worker and only the delivered request becomes current()',
                  'cancel before queued read prevents evaluation and late work cannot restore state()',
                  'cancel after computation but before delivery rejects the completed report()',
                  'switching snapshots prevents an older delivered result from replacing the selected identity()',
                  'same entry retry and ABA selection require new opaque request authority()',
                  'a real result for another Build or revision is rejected by the active delivery boundary()',
                  'a result from an equivalent earlier request cannot complete a newer attempt()',
                  'source deletion does not revoke an independently retained historical read()',
                  'captured old index permits historical inspection without repairing missing current index()',
                  'foreign archive receipt and missing retained bytes never select a replacement()',
                  'unsupported numeric profile produces a recoverable explicit failure()',
                  'worker and delivery rejection expose failure instead of an apparent current result()',
                  'evaluator and observer exceptions cannot manufacture a report or strand a completed attempt()',
                  'close retires both queued phases and cannot be reopened by an old or fresh caller()',
              },
              'ai.pickyour.core.drafts.SnapshotArchiveInspectionTest': {
                  'inspection cannot initialize an unused namespace or reconstruct a lost seal or index()',
                  'inspection captures the exact existing index without activation or source liveness()',
              },
              'ai.pickyour.core.evaluation.FrozenDiagnosticEvaluatorTest': {
                  'raw numeric spelling reaches the strict reader unchanged()',
                  'streams remain open and repeated runs have independent budgets()',
                  'ambiguous selections remain unknown without guessing first match()',
                  'derived VRAM accepts exact 28 digits and rejects a rounded 29 digit product()',
                  'string scans charge their full work before execution()',
                  'foreign catalog and rules locks reject before report creation()',
                  'schema valid swapped catalog identities reject kind mismatch()',
                  'raw floating and exponent operands reject even nested or opposite missing()',
                  'original-strict-False',
                  'original-strict-True',
                  'decimal-equal',
                  'decimal-boundary',
                  'decimal-zero',
                  'decimal-string-nonnumeric',
                  'bool-python-equality',
                  'nested-container-equality',
                  'nested-no-string-coercion',
                  'nested-containment',
                  'substring',
                  'empty-substring',
                  'in-array',
                  'subset',
                  'intersection',
                  'empty-intersection',
                  'missing',
                  'all-false-dominates',
                  'any-true-dominates',
                  'not-unknown',
                  'implies-false',
                  'exists-null',
                  'exists-false',
                  'skipped',
                  'unknown-applicability',
                  'warning-failure',
                  'set operands stay unsupported with opposite missing()',
                  'duplicate identities reject across all three documents()',
                  'budget exhaustion never emits a partial compatible report()',
                  'unsupported version and malformed field reject()',
                  'selected item version mismatch is rejected before metrics()',
                  'reference exceptions stay unsupported rather than invented verdicts()',
                  'recursive container containment charges nested comparisons()',
                  'nested string comparisons consume containment work()',
                  'float encoded identity revisions remain unsupported()',
                  'ASCII array pointer preserves leading zeros and missing paths()',
              },
          }
          total = 0
          for name, required in expected.items():
              path = pathlib.Path('core/build/test-results/test') / ("TEST-" + name + ".xml")
              suite = ET.parse(path).getroot()
              cases = suite.findall("testcase")
              names = [case.attrib["name"] for case in cases]
              if suite.attrib.get("name") != name or not required <= set(names) or len(names) != len(set(names)):
                  raise SystemExit("Missing, foreign or repeated retained-snapshot regression")
              if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit("Retained-snapshot suite did not execute cleanly")
              if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
                  raise SystemExit("Retained-snapshot regression did not pass")
              total += len(cases)
          print(f"Verified {total} retained-snapshot and frozen evaluator cases; native execution remains separate")
          PYTEST
      - name: Require parser-derived workload field feedback regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = "ai.pickyour.core.preview.PreviewWorkloadValidationTest"
          report = pathlib.Path("core/build/test-results/test/TEST-" + qualified + ".xml")
          suite = ET.parse(report).getroot()
          required = {
              "emptyInputsStayUnansweredAndEveryTypedClassificationIsValid()",
              "independentInvalidFieldsDoNotBlameValidOrUnansweredValues()",
              "budgetFeedbackPreservesCanonicalDecimalPrecisionAndRejectsLocaleCoercion()",
              "integerFeedbackUsesExactBoundsAndNeverTreatsUnknownAsAMeasurement()",
              "textLimitsUseTheExistingStringBudgetWithoutTrimmingOrTruncation()",
              "currencyFeedbackUsesTheExistingFullUppercasePattern()",
              "rejectedWholeEditRemainsAFormFailureWithoutInventingAFieldFailure()",
              "feedbackIsImmutableValueFreeAndIndependentOfLaterCorrections()",
          }
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != qualified or any(case.attrib.get("classname") != qualified for case in cases):
              raise SystemExit("Wrong workload field feedback suite")
          if not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing or repeated workload field feedback regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Workload field feedback totals do not match passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Workload field feedback regression did not pass")
          print(f"Verified {len(cases)} parser-derived workload field feedback cases")
          PYTEST
      - name: Require typed context policy preparation and managed storage regressions
        run: |
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          qualified = "ai.pickyour.core.preview.PreviewContextPolicySettingsTest"
          required = {
              "metadataComesFromAllFrozenKindsAndKeepsContextConstraintsImmutable()",
              "initialInputPreservesExplicitZeroAndOptionalAbsenceWithoutDefaults()",
              "requiredEmptyAndRequestedZeroAreRejectedWhileReservedZeroIsValid()",
              "exactWideIntegersAndIntegralAliasesNeverNarrowOrRound()",
              "malformedLocaleFractionalAndNonNumericInputCannotPrepareACommand()",
              "fieldParserRejectsExtraDuplicateAndTrailingWrapperContent()",
              "everyCanonicalEnumAndExplicitRemovalPreserveAbsence()",
              "unknownEmptyAndDisplayLabelsNeverBecomeEnumWireValues()",
              "configureRetainsSelectionIdentityRoleFlagsNotesExtensionsAndUnrelatedContent()",
              "currentNoopStaleAndDeletedManagedAuthorityRemainDistinct()",
              "managedTypedValuesRoundTripThroughAnExplicitValidatedBuildCandidate()",
              "unsupportedKindAndValueFreeErrorsDoNotExposeRawSettings()",
          }
          suite = ET.parse(pathlib.Path("core/build/test-results/test/TEST-" + qualified + ".xml")).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != qualified or any(case.attrib.get("classname") != qualified for case in cases):
              raise SystemExit("Wrong context policy preparation suite")
          if not required <= set(names) or len(names) != len(set(names)):
              raise SystemExit("Missing or repeated context policy preparation regression")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Context policy preparation totals do not match passing execution")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Context policy preparation regression did not pass")
          print(f"Verified {len(cases)} exact context policy preparation and managed storage cases")
          PYTEST
      - name: Require every retained configuration golden
        run: |
          python - <<'PYCONFIGURATION'
          import pathlib
          import xml.etree.ElementTree as ET
          required = {
              "all-active-control",
              "contradictory-target-region",
              "contradictory-host-region",
              "contradictory-self-hosted-serving",
              "optional-t3-t4-t5-disabled",
              "optional-t3-enabled",
              "optional-t4-enabled-without-t3-vector",
              "optional-t5-enabled",
              "rag-with-disabled-knowledge",
              "agent-with-disabled-framework",
              "training-with-disabled-compute",
              "production-with-disabled-guardrail",
              "development-with-disabled-guardrail",
              "hard-cap-disabled-without-cost",
              "zero-budget-without-cost",
              "precise-budget-without-cost",
              "adjacent-budget-without-cost",
          }
          name = "ai.pickyour.core.evaluation.RetainedConfigurationGoldenTest"
          path = pathlib.Path("core/build/test-results/test") / ("TEST-" + name + ".xml")
          suite = ET.parse(path).getroot()
          cases = suite.findall("testcase")
          names = [case.attrib["name"] for case in cases]
          if suite.attrib.get("name") != name or set(names) != required or len(names) != len(required):
              raise SystemExit("Missing, foreign or repeated retained configuration golden")
          if int(suite.attrib["tests"]) != len(cases) or any(int(suite.attrib.get(key, "0")) for key in ("failures", "errors", "skipped")):
              raise SystemExit("Retained configuration goldens did not execute cleanly")
          if any(case.findall("failure") or case.findall("error") or case.findall("skipped") for case in cases):
              raise SystemExit("Retained configuration golden did not pass")
          print(f"Verified all {len(cases)} complete retained configuration goldens")
          PYCONFIGURATION
      - name: Require every conformance fixture and private migration observation
        run: |
          mkdir -p build/conformance
          python scripts/check_conformance_fixtures.py --reports core/build/test-results/test --exit-code 0 --output build/conformance/qualified.json
      - name: Reject ignored packaged contract schemas
        run: python scripts/check_runtime_inventory_guards.py
      - name: Require actual inventory producer to reject Git replacement objects
        run: python scripts/check_runtime_inventory_source.py
      - name: Export and validate the current runtime SPDX document
        run: python scripts/runtime_sbom.py
      - name: Retain test and library artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-verification-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            core/build/libs/
            build/inventory/
            build/conformance/
            build/sbom/
          retention-days: 7
          if-no-files-found: ignore
  android-preview:
    name: Unsigned synthetic Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      unsigned_apk_sha256: ${{ steps.apk-handoff.outputs.sha256 }}
      unsigned_artifact_id: ${{ steps.upload-preview.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
